<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>資料收集工具</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .tabs { display: flex; border-bottom: 2px solid #007bff; margin-bottom: 24px; }
        .tab { padding: 10px 24px; cursor: pointer; border: 1px solid transparent; border-bottom: none; margin-bottom: -2px; border-radius: 4px 4px 0 0; color: #555; }
        .tab.active { background: #007bff; color: white; border-color: #007bff; }
        .tab:not(.active):hover { background: #e8f0fe; }
        .panel { display: none; }
        .panel.active { display: block; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type=text] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-top: 5px; }
        textarea { width: 100%; height: 200px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-top: 5px; }
        button { margin-top: 20px; padding: 10px 30px; background: #007bff; color: white; border: none; cursor: pointer; font-size: 16px; border-radius: 4px; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 4px; display: none; }
        .result.success { background: #d4edda; }
        .result.error { background: #f8d7da; }
    </style>
</head>
<body>
    <h2>📄 資料收集工具</h2>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('page')">📄 儲存網頁</div>
        <div class="tab" onclick="switchTab('youtube')">▶️ YouTube 逐字稿</div>
    </div>

    <!-- Tab 1: 儲存網頁 -->
    <div id="panel-page" class="panel active">
        <label>URL *</label>
        <input type="text" id="page-url" placeholder="https://example.com/stock/2330">

        <label>Source（來源標識，可空白）</label>
        <input type="text" id="page-source" placeholder="cnyes / twse / yahoo">

        <label>HTML Content *</label>
        <textarea id="page-html" placeholder="貼上網頁 HTML 內容..."></textarea>

        <button onclick="submitPage()">送出</button>
        <div id="page-result" class="result"></div>
    </div>

    <!-- Tab 2: YouTube 逐字稿 -->
    <div id="panel-youtube" class="panel">
        <label>YouTube URL *</label>
        <input type="text" id="yt-url" placeholder="https://www.youtube.com/watch?v=xxx">

        <button onclick="submitYoutube()">加入佇列</button>
        <div id="yt-result" class="result"></div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('panel-' + tab).classList.add('active');
        }

        async function submitPage() {
            const url = document.getElementById('page-url').value.trim();
            const source = document.getElementById('page-source').value.trim();
            const htmlContent = document.getElementById('page-html').value.trim();
            const resultDiv = document.getElementById('page-result');

            if (!url || !htmlContent) { alert('URL 和 HTML Content 為必填'); return; }

            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.textContent = '送出中...';

            try {
                const res = await fetch('https://stock.bignoodle.net/StockServer/stockPageRaw/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, htmlContent, source: source || null })
                });
                const data = await res.json();
                resultDiv.className = 'result success';
                resultDiv.textContent = `✅ 成功！id: ${data.id}，status: ${data.status}`;
            } catch (e) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ 錯誤：${e.message}`;
            }
        }

        async function submitYoutube() {
            const url = document.getElementById('yt-url').value.trim();
            const resultDiv = document.getElementById('yt-result');

            if (!url) { alert('請輸入 YouTube URL'); return; }

            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.textContent = '送出中...';

            try {
                const res = await fetch('https://stock.bignoodle.net/StockServer/youtubeTranscribe/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await res.json();
                resultDiv.className = 'result success';
                resultDiv.textContent = `✅ 成功！id: ${data.id}，status: ${data.status}`;
            } catch (e) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ 錯誤：${e.message}`;
            }
        }
    </script>
</body>
</html>
