<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StockApp</title>

    <link href="css/sb-admin-2.css?v=20260420" rel="stylesheet">
    <link href="vendor/font-awesome/css/font-awesome.min.css?v=20260420" rel="stylesheet" type="text/css">

    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->

    <style>
        /* Override sb-admin-2 sidebar layout — this page uses top navbar only */
        #page-wrapper { margin-left: 0 !important; padding: 0 15px 30px; }
        .navbar-brand { font-size: 17px; padding: 12px 15px; }

        /* Search row */
        .search-row { margin-top: 12px; margin-bottom: 4px; }
        .period-group { display: inline-block; margin-right: 8px; }
        .period-group .btn { padding: 6px 14px; }
        .period-group .btn.active { background-color: #337ab7; border-color: #2e6da4; color: #fff; }

        /* Stock info panel */
        #info-panel {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px 15px 6px;
            margin-bottom: 10px;
        }
        #info-name {
            font-size: 17px;
            font-weight: bold;
            margin: 0 0 8px;
            color: #222;
        }
        .info-item { text-align: center; padding: 4px 2px 8px; }
        .info-label { font-size: 11px; color: #999; margin-bottom: 2px; }
        .info-value { font-size: 16px; font-weight: bold; color: #333; }

        /* Tabs */
        .nav-tabs { margin-bottom: 0; }
        .tab-content { border: 1px solid #ddd; border-top: none; padding: 10px 6px 6px; background: #fff; }

        /* Tables in tabs */
        .tab-content .table-responsive { margin-top: 6px; }

        /* Mobile overrides */
        @media (max-width: 767px) {
            .bootstrap-select.form-control:not([class*="col-"]) { width: 100% !important; }
            #stock-select-wrapper { margin-bottom: 8px; }
            .nav-tabs > li > a { padding: 8px 10px; font-size: 13px; }
        }
    </style>
</head>

<body>
<div id="wrapper">

    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Page content -->
    <div id="page-wrapper">
        <div class="container-fluid">

            <!-- Search row -->
            <div class="row search-row">
                <div class="col-xs-12 col-sm-7 col-md-5" id="stock-select-wrapper">
                    <select id="stock-select" title="可輸入代碼搜尋"

                    </select>
                </div>
                <div class="col-xs-12 col-sm-5 col-md-4">
                    <div class="period-group btn-group" role="group">
                        <button type="button" class="btn btn-default period-btn active" data-period="D">日</button>
                        <button type="button" class="btn btn-default period-btn" data-period="W">週</button>
                        <button type="button" class="btn btn-default period-btn" data-period="M">月</button>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="doQuery()">查詢</button>
                </div>

            <!-- Stock info panel (hidden until query) -->
            <div id="info-panel" style="display:none;">
                <div class="row">
                    <div class="col-xs-12">
                        <p id="info-name"></p>
                    </div>
                </div>
                <div class="row">
                    <div class="col-xs-6 col-sm-2">
                        <div class="info-item">

                            <div class="info-value" id="info-price">—</div>
                        </div>
                    </div>
                    <div class="col-xs-6 col-sm-2">
                        <div class="info-item">
                            <div class="info-label">PE</div>
                            <div class="info-value" id="info-pe">—</div>
                        </div>
                    </div>
                    <div class="col-xs-6 col-sm-2">
                        <div class="info-item">
                            <div class="info-label">PB</div>
                            <div class="info-value" id="info-pb">—</div>
                        </div>
                    </div>
                    <div class="col-xs-6 col-sm-2">
                        <div class="info-item">
                            <div class="info-label">ROE</div>
                            <div class="info-value" id="info-roe">—</div>
                        </div>
                    </div>
                    <div class="col-xs-6 col-sm-2">
                        <div class="info-item">

                            <div class="info-value" id="info-yield">—</div>

                    </div>
                    <div class="col-xs-6 col-sm-2">
                        <div class="info-item">
                            <div class="info-label">EPS</div>
                            <div class="info-value" id="info-eps">—</div>

            </div>

            <!-- Main tabs -->

                <div class="col-xs-12">
                    <ul class="nav nav-tabs" id="main-tabs">
                        <li class="active">
                            <a href="#tab-gate" data-toggle="tab">

                            </a>

                        <li>

                                <span class="visible-xs-inline">中軸</span>
                                <span class="hidden-xs">多空中軸</span>
                            </a>
                        </li>
                        <li>
                            <a href="#tab-funda" data-toggle="tab">
                                <span class="visible-xs-inline">基本面</span>
                                <span class="hidden-xs">基本面</span>
                            </a>
                        </li>
                        <li>
                            <a href="#tab-exclude" data-toggle="tab">
                                <span class="visible-xs-inline">除權息</span>

                        <div id="tab-gate" class="tab-pane fade in active">
                            <div id="chart-gate" style="width:100%;"></div>

                        <!-- Tab 2: 多空中軸 -->
                        <div id="tab-turn" class="tab-pane fade">
                            <div id="chart-turn" style="width:100%;"></div>

                        <!-- Tab 3: 基本面 -->
                        <div id="tab-funda" class="tab-pane fade">
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered table-hover" id="funda-table">
                                    <thead>
                                        <tr>
                                            <th>季度</th>
                                            <th>營收</th>
                                            <th>淨利</th>
                                            <th>EPS</th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Tab 4: 除權息 -->
                        <div id="tab-exclude" class="tab-pane fade">
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered table-hover" id="exclude-table">
                                    <thead>
                                        <tr>
                                            <th>除權息日</th>
                                            <th>價格</th>
                                            <th>除後參考價</th>
                                            <th>配息</th>
                                            <th>配股</th>
                                            <th>除息率%</th>
                                            <th>除權率%</th>
                                            <th>殖利率%</th>

                                    <tbody></tbody>
                                </table>

                        </div>

                        <!-- Tab 5: 轉折分析 -->

                                <table class="table table-bordered" id="ta-table" style="font-size:13px">

                                        <td>R1</td><td>R2</td><td>R3</td><td>轉折變化分析</td><td>交易策略</td>

                                    <!-- 日 -->
                                    <tr class="headerTr">

                                        <td><span id="ta-D3"></span></td><td><span id="ta-D4"></span></td>
                                        <td><span id="ta-D5"></span></td>
                                        <td rowspan="2"><span id="ta-D16"></span></td>
                                    </tr>
                                    <tr>
                                        <td>日轉折</td>
                                        <td><span id="ta-D6"></span></td><td><span id="ta-D7"></span></td>
                                        <td><span id="ta-D8"></span></td><td><span id="ta-D9"></span></td>
                                        <td><span id="ta-D10"></span></td>
                                    </tr>
                                    <tr>
                                        <td>時間分析</td>
                                        <td><span id="ta-D11"></span></td><td><span id="ta-D12"></span></td>
                                        <td><span id="ta-D13"></span></td><td><span id="ta-D14"></span></td>
                                        <td><span id="ta-D15"></span></td><td><span id="ta-D17"></span></td>

                                    <!-- 週 -->
                                    <tr class="headerTr">
                                        <td>周日期</td>
                                        <td><span id="ta-W1"></span></td><td><span id="ta-W2"></span></td>
                                        <td><span id="ta-W3"></span></td><td><span id="ta-W4"></span></td>
                                        <td><span id="ta-W5"></span></td>
                                        <td rowspan="2"><span id="ta-W16"></span></td>
                                    </tr>
                                    <tr>
                                        <td>周轉折</td>
                                        <td><span id="ta-W6"></span></td><td><span id="ta-W7"></span></td>
                                        <td><span id="ta-W8"></span></td><td><span id="ta-W9"></span></td>
                                        <td><span id="ta-W10"></span></td>
                                    </tr>
                                    <tr>
                                        <td>時間分析</td>
                                        <td><span id="ta-W11"></span></td><td><span id="ta-W12"></span></td>
                                        <td><span id="ta-W13"></span></td><td><span id="ta-W14"></span></td>
                                        <td><span id="ta-W15"></span></td><td><span id="ta-W17"></span></td>
                                    </tr>
                                    <!-- 月 -->
                                    <tr class="headerTr">
                                        <td>月份</td>
                                        <td><span id="ta-M1"></span></td><td><span id="ta-M2"></span></td>
                                        <td><span id="ta-M3"></span></td><td><span id="ta-M4"></span></td>
                                        <td><span id="ta-M5"></span></td>
                                        <td rowspan="2"><span id="ta-M16"></span></td>
                                    </tr>
                                    <tr>
                                        <td>月轉折</td>
                                        <td><span id="ta-M6"></span></td><td><span id="ta-M7"></span></td>
                                        <td><span id="ta-M8"></span></td><td><span id="ta-M9"></span></td>
                                        <td><span id="ta-M10"></span></td>
                                    </tr>
                                    <tr>
                                        <td>時間分析</td>
                                        <td><span id="ta-M11"></span></td><td><span id="ta-M12"></span></td>
                                        <td><span id="ta-M13"></span></td><td><span id="ta-M14"></span></td>

                    </div><!-- /.tab-content -->

<script type="text/javascript">
    initNavbar('index');

    var BASE_URL = 'https://stock.bignoodle.net/StockServer/';
    var tabLoaded = {};
    var currentStockId = '';
    var currentDateType = 'D';

    // Init stock dropdown
    initIds('stock-select');

    // Period button toggle — update active state and reload if a stock is already selected
    $('.period-btn').on('click', function () {
        var newPeriod = $(this).data('period');
        if (newPeriod === currentDateType) return;
        $('.period-btn').removeClass('active');
        $(this).addClass('active');
        currentDateType = newPeriod;

        if (!currentStockId) return;

        // Reset all tabs so they reload with the new period
        tabLoaded = {};
        $('#chart-gate').empty();
        $('#chart-turn').empty();
        $('#funda-table tbody').empty();
        $('#exclude-table tbody').empty();
        $('#ta-table span[id^="ta-"]').text('');

        // Reload whichever tab is currently visible
        var activeTabId = $('#main-tabs .active a').attr('href');
        if (activeTabId) loadTab(activeTabId.replace('#', ''));
    });

    // Lazy-load tab on first show
    $('#main-tabs a').on('shown.bs.tab', function (e) {
        var tabId = $(e.target).attr('href').replace('#', '');
        loadTab(tabId);
    });

    function getChartHeight() {
        return $(window).width() < 768 ? 450 : 600;
    }

    function setChartContainerHeight(id) {
        $('#' + id).css('height', getChartHeight() + 'px');
    }

    /* ── Main query ─────────────────────────────────────── */
    function doQuery() {
        var si = $('#stock-select').val();
        if (!si) { alert('請選擇股票'); return; }
        currentStockId = si.toUpperCase();

        // Reset all tabs
        tabLoaded = {};
        $('#chart-gate').empty();
        $('#chart-turn').empty();
        $('#funda-table tbody').empty();
        $('#exclude-table tbody').empty();
        $('#ta-table span[id^="ta-"]').text('');

        // Reset info panel
        $('#info-price, #info-pe, #info-pb, #info-roe, #info-yield, #info-eps').text('—');
        $('#info-name').text(currentStockId);
        $('#info-panel').fadeIn();

        // Load fundamental info row
        loadInfoRow(currentStockId);

        // Load whichever tab is currently active
        var activeTabId = $('#main-tabs .active a').attr('href');
        if (activeTabId) {
            loadTab(activeTabId.replace('#', ''));
        } else {
            loadTab('tab-gate');
        }
    }

    function loadTab(tabId) {
        if (!currentStockId) return;
        if (tabLoaded[tabId]) return;
        tabLoaded[tabId] = true;

        if (tabId === 'tab-gate')              loadGateChart();
        else if (tabId === 'tab-turn')         loadTurnChart();
        else if (tabId === 'tab-funda')        loadFundaData();
        else if (tabId === 'tab-exclude')      loadExcludeData();
        else if (tabId === 'tab-turn-analysis') loadTurnAnalysis();
    }

    /* ── Info row ───────────────────────────────────────── */
    function loadInfoRow(si) {
        var url = BASE_URL + 'fundamental/query?si=' + si + '&callback=call_info';
        $.ajax({
            url: url,
            dataType: 'jsonp',
            jsonpCallback: 'call_info',
            global: false,   // 不觸發 blockUI，避免 overlay 蓋住圖表
            timeout: 8000,
            success: function (data) {
                if (!data) return;
                var d = Array.isArray(data) ? data[0] : data;
                if (!d) return;
                if (d.stockName) $('#info-name').text(d.stockName);
                if (d.pe    != null) $('#info-pe').text(d.pe);
                if (d.pb    != null) $('#info-pb').text(d.pb);
                if (d.roe   != null) $('#info-roe').text(d.roe);
                if (d.yields != null) $('#info-yield').text(d.yields);
                else if (d.yield != null) $('#info-yield').text(d.yield);
                if (d.eps   != null) $('#info-eps').text(d.eps);
            },
            error: function () { /* fundamental/query 不存在時靜默忽略 */ }
        });
    }

    /* ── Tab 1: 多空戰K ─────────────────────────────────── */
    function loadGateChart() {
        var si = currentStockId;
        var dt = currentDateType;
        var url = BASE_URL + 'stock/queryStockTurnData?si=' + si + '&dt=' + dt + '&dn=20&callback=call_gate';
        setChartContainerHeight('chart-gate');
        $.ajax({
            url: url,
            dataType: 'jsonp',
            jsonpCallback: 'call_gate',
            success: function (data) {
                if (!data) return;
                var closePrice = data['close'];
                $('#info-price').text(closePrice);
                if ($('#info-name').text() === si && data['sname']) {
                    $('#info-name').text(data['sname']);
                }
                $('#chart-gate').highcharts('StockChart', {
                    chart: {
                        reflow: true,
                        height: getChartHeight()
                    },
                    tooltip: { xDateFormat: '%Y-%m-%d', shared: true },
                    colors: ['#058DC7','#50B432','#ED561B','#CC7700','#4f9ab7',
                             '#64E572','#FF9655','#FFF263','#873322'],
                    plotOptions: {
                        candlestick: {
                            color: '#005500', lineColor: '#005500',
                            upColor: '#D52B00', upLineColor: '#D52B00'
                        },
                        column: { color: '#FF9900' },
                        line: {
                            lineWidth: 2,
                            marker: { states: { hover: { enabled: false }, select: { enabled: false } } }
                        },
                        dataLabels: { enabled: false }
                    },
                    rangeSelector: { enabled: false },
                    title: { text: data['sname'] },
                    series: [
                        { type: 'candlestick', name: data['sname'], data: data['sdata'] },
                        { name: '買耗',   data: data['level1'], color: '#058DC7' },
                        { name: '軋空',   data: data['level2'], color: '#873322' },
                        { name: '轉強',   data: data['level3'], color: '#FFF263' },
                        { name: '中軸',   data: data['level4'], color: '#FF9655' },
                        { name: '回撐',   data: data['level5'], color: '#64E572' },
                        { name: '轉弱',   data: data['level6'], color: '#4f9ab7' },
                        { name: '殺多',   data: data['level7'], color: '#CC7700' },
                        { name: '賣耗',   data: data['level8'], color: '#ED561B' },
                        { name: '多空線', data: data['level9'], color: '#50B432' }
                    ]
                });
            },
            error: function () {
                $('#chart-gate').html('<p class="text-danger" style="padding:20px;">多空戰K 查詢失敗</p>');
            }
        });
    }

    /* ── Tab 2: 多空中軸 ─────────────────────────────────── */
    function loadTurnChart() {
        var si = currentStockId;
        var dt = currentDateType;
        var url = BASE_URL + 'stock/queryStockTurnDataK?si=' + si + '&dt=' + dt + '&dn=50&callback=call_turn';
        setChartContainerHeight('chart-turn');
        $.ajax({
            url: url,
            dataType: 'jsonp',
            jsonpCallback: 'call_turn',
            success: function (data) {
                if (!data) return;
                var data_bl=[], data_bk=[];
                var data_bj=[], data_bi=[], data_bg=[], data_be=[], data_bc=[], data_ba=[];
                var data_aw=[], data_at=[], data_ao=[], data_al=[], data_aj=[], data_ah=[], data_f=[];
                var charts = data['charts'];
                $.each(charts, function (index, value) {
                    var t = data['sdata'][index][0];
                    data_f.push([t,  value['value1']]);
                    data_ah.push([t, value['value10']]);
                    data_aj.push([t, value['value11']]);
                    data_al.push([t, value['value12']]);
                    data_ao.push([t, value['value15']]);
                    data_at.push([t, value['value17']]);
                    data_aw.push([t, value['middle']]);
                    data_ba.push([t, value['value20']]);
                    data_bc.push([t, value['value21']]);
                    data_be.push([t, value['value22']]);
                    data_bg.push([t, value['value23']]);
                    data_bi.push([t, value['value24']]);
                    data_bj.push([t, value['value25']]);
                    data_bk.push([t, value['value26']]);
                    data_bl.push([t, value['value27']]);
                });
                $('#chart-turn').highcharts('StockChart', {
                    chart: { reflow: true, height: getChartHeight() },
                    tooltip: { xDateFormat: '%Y-%m-%d', shared: true },
                    colors: ['#058DC7','#50B432','#ED561B','#CC7700','#4f9ab7',
                             '#64E572','#FF9655','#FFF263','#873322'],
                    plotOptions: {
                        candlestick: {
                            color: '#005500', lineColor: '#005500',
                            upColor: '#D52B00', upLineColor: '#D52B00'
                        },
                        column: { color: '#FF9900' },
                        line: {
                            lineWidth: 2,
                            marker: { states: { hover: { enabled: false }, select: { enabled: false } } }
                        },
                        dataLabels: { enabled: false }
                    },
                    rangeSelector: { enabled: false },
                    title: { text: data['sname'] },
                    series: [
                        { type: 'candlestick', name: data['sname'], data: data['sdata'] },
                        { name: '日續漲',           data: data_bj, color: '#A5FFC7' },
                        { name: '過起漲',           data: data_bi, color: '#058DC7' },
                        { name: '過起漲3',          data: data_bg, color: '#873322' },
                        { name: '續漲-不破續多',     data: data_be, color: '#FFF263' },
                        { name: '反彈峰B',          data: data_bc, color: '#FF9655' },
                        { name: 'T盤漲',            data: data_ba, color: '#64E572' },
                        { name: '日多空中軸',        data: data_aw, color: '#4f9ab7' },
                        { name: '回檔買點/反彈賣點', data: data_at, color: '#CC7700' },
                        { name: '彈仍跌(放空)',      data: data_ao, color: '#ED561B' },
                        { name: '碰主跌=搶短點',     data: data_al, color: '#50B432' },
                        { name: '破續跌續空',        data: data_aj, color: '#50B432' },
                        { name: '日續跌',           data: data_ah, color: '#70a480' },
                        { name: 'DD開盤破站不上空',  data: data_f,  color: '#a08050' },
                        { name: '主升', data: data_bk, type: 'line', color: '#FF6600', lineWidth: 1, marker: { enabled: false } },
                        { name: '強波', data: data_bl, type: 'line', color: '#FF0000', lineWidth: 1, marker: { enabled: false } }
                    ]
                });
            },
            error: function () {
                $('#chart-turn').html('<p class="text-danger" style="padding:20px;">多空中軸 查詢失敗</p>');
            }
        });
    }

    /* ── Tab 3: 基本面 ──────────────────────────────────── */
    function loadFundaData() {
        var si = currentStockId;
        var url = BASE_URL + 'fundamental/query?si=' + si + '&callback=call_funda';
        $.ajax({
            url: url,
            dataType: 'jsonp',
            jsonpCallback: 'call_funda',
            success: function (data) {
                var $tbody = $('#funda-table tbody').empty();
                var items = Array.isArray(data) ? data : (data && data.finan ? data.finan : null);
                if (!items || !items.length) {
                    $tbody.append('<tr><td colspan="4" class="text-center">無資料</td></tr>');
                    return;
                }
                $.each(items, function (i, item) {
                    var tr = '<tr>'
                        + '<td>' + (item.fiscalDate || item.dataDate || '') + '</td>'
                        + '<td>' + (item.revenue   != null ? item.revenue   : '—') + '</td>'
                        + '<td>' + (item.netIncome != null ? item.netIncome : '—') + '</td>'
                        + '<td>' + (item.eps       != null ? item.eps       : '—') + '</td>'
                        + '</tr>';
                    $tbody.append(tr);
                });
            },
            error: function () {
                $('#funda-table tbody').html('<tr><td colspan="4" class="text-center text-danger">查詢失敗</td></tr>');
            }
        });
    }

    /* ── Tab 5: 轉折分析 ────────────────────────────────── */
    function loadTurnAnalysis() {
        var si = currentStockId;
        ['D', 'W', 'M'].forEach(function (dt) {
            var cbName = 'call_ta_' + dt;
            var url = BASE_URL + 'stock/queryStockTurnData?si=' + si + '&dt=' + dt + '&dn=20&callback=' + cbName;
            $.ajax({
                url: url, dataType: 'jsonp', jsonpCallback: cbName,
                success: function (data) {
                    if (dt === 'D') $('#ta-close').text(data['close'] != null ? data['close'] : '');
                    for (var i = 1; i <= 15; i++) {
                        $('#ta-' + dt + i).html(data[dt + i] != null ? data[dt + i] : '');
                    }
                    $('#ta-' + dt + '17').html(data[dt + '17'] != null ? data[dt + '17'] : '');
                    var text16 = (data[dt + '16'] || '') + '<br/>上方 ' + (data[dt + '18'] || '') + '<br/>下方 ' + (data[dt + '19'] || '');
                    $('#ta-' + dt + '16').html(text16);
                },
                error: function () { /* 靜默忽略 */ }
            });
        });
    }

    /* ── Tab 4: 除權息（過濾當前股票）────────────────────── */
    function loadExcludeData() {
        var si = currentStockId;
        var url = BASE_URL + 'stockExclude/queryExcludeData?callback=jsonp';
        $.ajax({
            url: url,
            dataType: 'jsonp',
            jsonpCallback: 'jsonp',
            success: function (result) {
                var $tbody = $('#exclude-table tbody').empty();
                var found = false;
                $.each(result, function (idx, obj) {
                    if (!obj.id || obj.id.stockId.toUpperCase() !== si) return;
                    found = true;
                    var date = new Date(obj.excludeDate);
                    var dateStr = date.getFullYear() + '/' + (date.getMonth() + 1) + '/' + date.getDate();
                    var hl = obj.excludeDividendRate >= 5 ? ' style="background-color:#fff700"' : '';
                    var yields = obj.cashYields != null ? obj.cashYields
                                : (obj.yields != null ? obj.yields : '—');
                    var tr = '<tr' + hl + '>'
                        + '<td>' + dateStr + '</td>'
                        + '<td>' + obj.price + '</td>'
                        + '<td>' + obj.afterExPrice + '</td>'
                        + '<td>' + obj.excludeDividend + '</td>'
                        + '<td>' + obj.excludeRight + '</td>'
                        + '<td>' + obj.excludeDividendRate + '</td>'
                        + '<td>' + obj.excludeRightRate + '</td>'
                        + '<td>' + yields + '</td>'
                        + '</tr>';
                    $tbody.append(tr);
                });
                if (!found) {
                    $tbody.append('<tr><td colspan="8" class="text-center">無除權息紀錄</td></tr>');
                }
            },
            error: function () {
                $('#exclude-table tbody').html('<tr><td colspan="8" class="text-center text-danger">查詢失敗</td></tr>');
            }
        });
    }
</script>
</body>
</html>
